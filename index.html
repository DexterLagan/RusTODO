<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RusTODO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f7f5;
    --fg: #2b2b28;
    --card: #fff;
    --btn-bg: #fff;
    --btn-fg: #4a4a45;
    --btn-hover: #f0efe9;
    --border: #e7e4dd;
    --border-2: #ddd9d2;
    --focus: #b9c4ae;
    --dot: #c2beb4;
    --del-hover: #c0684f;
    --muted: #a8a49b;
    --faint: #b3afa6;
    --label: #a09c92;
    --card-border: #e2ded6;
    --accent: #6f8b5e;
    --accent-hover: #637c54;
    --on-accent: #fff;
    --overlay: rgba(43, 43, 40, 0.28);
    --status: #7a8b6f;
    --shadow: rgba(0, 0, 0, 0.16);
  }

  html[data-theme="dark"] {
    --bg: #1b1b18;
    --fg: #e4e2da;
    --card: #24241f;
    --btn-bg: #24241f;
    --btn-fg: #c9c6bc;
    --btn-hover: #30302a;
    --border: #34342e;
    --border-2: #3e3e36;
    --focus: #7d9a6c;
    --dot: #5f5c51;
    --del-hover: #d07a5f;
    --muted: #6f6b60;
    --faint: #6b675c;
    --label: #8a8678;
    --card-border: #3a3a33;
    --accent: #85a172;
    --accent-hover: #93ad80;
    --on-accent: #151a0e;
    --overlay: rgba(0, 0, 0, 0.5);
    --shadow: rgba(0, 0, 0, 0.5);
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 14px 8px;
  }

  h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-right: auto;
  }

  .btn {
    border: 1px solid var(--border-2);
    background: var(--btn-bg);
    color: var(--btn-fg);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 7px;
    cursor: pointer;
  }

  .btn:hover { background: var(--btn-hover); }

  .icon-btn {
    border: 1px solid var(--border-2);
    background: var(--btn-bg);
    color: var(--btn-fg);
    width: 26px;
    height: 26px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }

  .icon-btn:hover { background: var(--btn-hover); }

  .icon-btn svg { display: block; }
  .icon-btn .icon-sun { display: none; }
  html[data-theme="dark"] .icon-btn .icon-moon { display: none; }
  html[data-theme="dark"] .icon-btn .icon-sun { display: block; }

  #status {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--status);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }

  #status.show { opacity: 1; }

  .add-row {
    display: flex;
    gap: 6px;
    padding: 4px 14px 10px;
  }

  #new-item {
    flex: 1;
    border: 1px solid var(--border-2);
    background: var(--card);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }

  #new-item:focus { border-color: var(--focus); }

  ul#list {
    flex: 1;
    overflow-y: auto;
    list-style: none;
    padding: 2px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 10px;
    cursor: pointer;
  }

  .item.dragging { opacity: .35; }

  .handle {
    width: 8px;
    height: 16px;
    flex-shrink: 0;
    background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.3px);
    background-size: 5px 8px;
    cursor: grab;
  }

  .item input[type="checkbox"] {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .text {
    flex: 1;
    font-size: 13px;
    line-height: 1.35;
    word-break: break-word;
    user-select: text;
  }

  .item.done .text {
    text-decoration: line-through;
    color: var(--muted);
  }

  .del {
    border: none;
    background: none;
    color: var(--dot);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
    visibility: hidden;
  }

  .item:hover .del { visibility: visible; }
  .del:hover { color: var(--del-hover); }

  .empty {
    text-align: center;
    color: var(--faint);
    font-size: 13px;
    padding-top: 28px;
  }

  #edit-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  #edit-overlay[hidden] {
    display: none;
  }

  .edit-card {
    width: min(280px, calc(100vw - 40px));
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    box-shadow: 0 12px 32px var(--shadow);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .edit-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--label);
  }

  #edit-input {
    border: 1px solid var(--border-2);
    background: var(--card);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }

  #edit-input:focus {
    border-color: var(--focus);
  }

  .edit-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }
</style>
<script>
  (function () {
    var t = localStorage.getItem("rustodo.theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<header>
  <h1>RusTODO</h1>
  <span id="status"></span>
  <button class="icon-btn" id="theme-btn" title="Switch to dark mode" aria-label="Switch to dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
  </button>
  <button class="btn" id="load-btn">Load</button>
  <button class="btn" id="save-btn">Save</button>
</header>

<div class="add-row">
  <input id="new-item" type="text" placeholder="Add a todo…" autocomplete="off" />
</div>

<ul id="list"></ul>

<div id="edit-overlay" hidden>
  <div class="edit-card">
    <div class="edit-label">Edit todo</div>
    <input id="edit-input" type="text" autocomplete="off" spellcheck="false" />
    <div class="edit-actions">
      <button class="btn" id="edit-cancel">Cancel</button>
      <button class="btn btn-primary" id="edit-save">Save</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
