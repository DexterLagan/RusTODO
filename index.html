<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rustodo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f7f7f5;
    color: #2b2b28;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 14px 8px;
  }

  h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-right: auto;
  }

  .btn {
    border: 1px solid #ddd9d2;
    background: #fff;
    color: #4a4a45;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 7px;
    cursor: pointer;
  }

  .btn:hover { background: #f0efe9; }

  #status {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #7a8b6f;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }

  #status.show { opacity: 1; }

  .add-row {
    display: flex;
    gap: 6px;
    padding: 4px 14px 10px;
  }

  #new-item {
    flex: 1;
    border: 1px solid #ddd9d2;
    background: #fff;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }

  #new-item:focus { border-color: #b9c4ae; }

  ul#list {
    flex: 1;
    overflow-y: auto;
    list-style: none;
    padding: 2px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid #e7e4dd;
    border-radius: 9px;
    padding: 8px 10px;
    cursor: default;
  }

  .item.dragging { opacity: .35; }

  .handle {
    width: 8px;
    height: 16px;
    flex-shrink: 0;
    background-image: radial-gradient(circle, #c2beb4 1.2px, transparent 1.3px);
    background-size: 5px 8px;
    cursor: grab;
  }

  .item input[type="checkbox"] {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    accent-color: #6f8b5e;
    cursor: pointer;
  }

  .text {
    flex: 1;
    font-size: 13px;
    line-height: 1.35;
    word-break: break-word;
    user-select: text;
  }

  .item.done .text {
    text-decoration: line-through;
    color: #a8a49b;
  }

  .del {
    border: none;
    background: none;
    color: #c2beb4;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
    visibility: hidden;
  }

  .item:hover .del { visibility: visible; }
  .del:hover { color: #c0684f; }

  .empty {
    text-align: center;
    color: #b5b1a7;
    font-size: 13px;
    margin-top: 40px;
  }
</style>
</head>
<body>
<header>
  <h1>Rustodo</h1>
  <span id="status"></span>
  <button class="btn" id="load-btn">Load</button>
  <button class="btn" id="save-btn">Save</button>
</header>

<div class="add-row">
  <input id="new-item" type="text" placeholder="Add a todo…" autocomplete="off" />
</div>

<ul id="list"></ul>

<script type="module" src="/src/main.js"></script>
</body>
</html>
